
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GeoRescue Howrah</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
    }

    header {
      background: #16324f;
      color: white;
      padding: 18px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin-bottom: 0;
    }

    #map {
      width: 100%;
      height: 72vh;
    }

    #information {
      background: white;
      padding: 16px 24px;
      font-size: 15px;
    }

    .legend {
      background: white;
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 1px 6px #999;
      line-height: 25px;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 7px;
    }
  </style>
</head>

<body>

  <header>
    <h1>GeoRescue Howrah</h1>
    <p>
      Interactive Fire and Emergency Response
      Intelligence Dashboard
    </p>
  </header>

  <div id="map"></div>

  <div id="information">
    Loading emergency facility data...
  </div>

  <script>

    // --------------------------------
    // 1. CREATE THE MAP
    // --------------------------------

    const map = L.map("map").setView(
      [22.5958, 88.2636], 13
    );

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    // --------------------------------
    // 2. SIMULATED FIRE INCIDENT
    // --------------------------------

    const fireIncident = L.marker(
      [22.5958, 88.2636]
    ).addTo(map);

    fireIncident.bindPopup(
      "<b>SIMULATED FIRE INCIDENT</b><br>" +
      "Training demonstration only"
    );


    // --------------------------------
    // 3. CREATE GIS LAYERS
    // --------------------------------

    const fireStations = L.layerGroup().addTo(map);
    const hospitals = L.layerGroup().addTo(map);


    // --------------------------------
    // 4. LAYER SELECTION CONTROL
    // --------------------------------

    L.control.layers(null, {
      "Fire Stations": fireStations,
      "Hospitals": hospitals
    }, {
      collapsed: false
    }).addTo(map);


    // --------------------------------
    // 5. MAP LEGEND
    // --------------------------------

    const legend = L.control({
      position: "bottomright"
    });

    legend.onAdd = function() {
      const div = L.DomUtil.create("div", "legend");

      div.innerHTML = `
        <div class="legend-title">Map Legend</div>

        <div>
          <span class="legend-dot"
                style="background:#dc2626"></span>
          Fire Station
        </div>

        <div>
          <span class="legend-dot"
                style="background:#2563eb"></span>
          Hospital
        </div>

        <div>
          📍 Simulated Fire Incident
        </div>
      `;

      return div;
    };

    legend.addTo(map);


    // --------------------------------
    // 6. LOAD SAVED GEOJSON DATA
    // --------------------------------

    async function loadFacilities() {

      const info = document.getElementById(
        "information"
      );

      try {

        const response = await fetch(
          "./emergency_facilities.geojson"
        );

        if (!response.ok) {
          throw new Error(
            "GeoJSON file not found (HTTP " +
            response.status + ")"
          );
        }

        const data = await response.json();

        if (data.type !== "FeatureCollection" ||
            !Array.isArray(data.features)) {
          throw new Error(
            "File must contain a GeoJSON FeatureCollection"
          );
        }

        let fireCount = 0;
        let hospitalCount = 0;

        // Read features from GeoJSON
        L.geoJSON(data, {

          filter: function(feature) {
            const amenity =
              feature.properties?.amenity;

            return amenity === "fire_station" ||
                   amenity === "hospital";
          },

          pointToLayer: function(feature, latlng) {

            const isFire =
              feature.properties?.amenity ===
              "fire_station";

            const color = isFire
              ? "#dc2626"
              : "#2563eb";

            return L.circleMarker(latlng, {
              radius: 8,
              color: "white",
              weight: 2,
              fillColor: color,
              fillOpacity: 0.95
            });
          },

          onEachFeature: function(feature, layer) {

            const properties =
              feature.properties || {};

            const isFire =
              properties.amenity === "fire_station";

            const targetLayer = isFire
              ? fireStations
              : hospitals;

            const popup = document.createElement(
              "div"
            );

            const heading = document.createElement(
              "strong"
            );

            heading.textContent =
              properties.name || "Unnamed facility";

            const category = document.createElement(
              "p"
            );

            category.textContent = isFire
              ? "Fire Station"
              : "Hospital";

            popup.appendChild(heading);
            popup.appendChild(category);

            layer.bindPopup(popup);

            // Add each feature to its thematic layer
            layer.addTo(targetLayer);

            if (isFire) {
              fireCount++;
            } else {
              hospitalCount++;
            }
          }

        });

        info.textContent =
          "Saved OpenStreetMap data loaded: " +
          fireCount + " fire stations and " +
          hospitalCount + " hospitals. " +
          "Click a facility for details.";

      } catch (error) {

        info.textContent =
          "Unable to load emergency facilities: " +
          error.message;

        console.error(error);
      }
    }

    loadFacilities();


    // --------------------------------
    // 7. CLICK MAP TO VIEW COORDINATES
    // --------------------------------

    map.on("click", function(event) {

      const latitude =
        event.latlng.lat.toFixed(5);

      const longitude =
        event.latlng.lng.toFixed(5);

      document.getElementById(
        "information"
      ).textContent =
        "Selected location — Latitude: " +
        latitude +
        " | Longitude: " +
        longitude;
    });

  </script>

</body>
</html>
