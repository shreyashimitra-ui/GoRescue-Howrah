
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GeoRescue Howrah</title>

  <!-- Leaflet map library -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
    }

    header {
      background: #16324f;
      color: white;
      padding: 20px;
    }

    h1 { margin: 0; }

    #map {
      height: 75vh;
      width: 100%;
    }

    #information {
      padding: 15px;
      background: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>GeoRescue Howrah</h1>
    <p>Fire and Emergency Response GIS Dashboard</p>
  </header>

  <div id="map"></div>

  <div id="information">
    Click anywhere on the map to view coordinates.
  </div>

  <script>
    // Create map centred on Howrah
    const map = L.map("map").setView(
      [22.5958, 88.2636], 14
    );

    // Add real OpenStreetMap background
    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    // Add a fictional fire incident
    const fire = L.marker(
      [22.5958, 88.2636]
    ).addTo(map);

    fire.bindPopup(
      "<b>Simulated Fire Incident</b><br>" +
      "Emergency training location"
    );

    // Display coordinates when clicked
    map.on("click", function(event) {
      const latitude = event.latlng.lat.toFixed(5);
      const longitude = event.latlng.lng.toFixed(5);

      document.getElementById(
        "information"
      ).textContent =
        "Latitude: " + latitude +
        " | Longitude: " + longitude;
    });
    
    // STEP 3: Create two separate GIS layers
    const fireStations = L.layerGroup().addTo(map);
    const hospitals = L.layerGroup().addTo(map);

    // Add layer selection control
    L.control.layers(null, {
      "Fire Stations": fireStations,
      "Hospitals": hospitals
    }, { collapsed: false }).addTo(map);

    // Search area: Howrah and nearby surroundings
    // Bounding box: south, west, north, east
    const query = `
      [out:json][timeout:25];
      (
        nwr["amenity"="fire_station"]
          (22.52,88.20,22.68,88.36);
        nwr["amenity"="hospital"]
          (22.52,88.20,22.68,88.36);
      );
      out center;
    `;

    // Retrieve geographic features from OpenStreetMap
    async function loadFacilities() {
      const info = document.getElementById("information");
      info.textContent = "Loading emergency facilities...";

      try {
        const url =
          "https://overpass.kumi.systems/api/interpreter?data="
          + encodeURIComponent(query);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Server returned " + response.status);
        }

        const data = await response.json();

        let fireCount = 0;
        let hospitalCount = 0;

        data.elements.forEach(function(feature) {
          const lat = feature.lat ?? feature.center?.lat;
          const lon = feature.lon ?? feature.center?.lon;

          if (lat == null || lon == null) return;

          const tags = feature.tags || {};
          const isFire = tags.amenity === "fire_station";

          const color = isFire ? "#dc2626" : "#2563eb";
          const layer = isFire ? fireStations : hospitals;

          const marker = L.circleMarker([lat, lon], {
            radius: 8,
            color: "white",
            weight: 2,
            fillColor: color,
            fillOpacity: 0.95
          });

          // Avoid inserting untrusted OSM text as HTML
          const name = tags.name || "Unnamed facility";

          const popup = document.createElement("div");
          const heading = document.createElement("strong");
          heading.textContent = name;
          popup.appendChild(heading);

          const category = document.createElement("p");
          category.textContent = isFire
            ? "Fire Station"
            : "Hospital";
          popup.appendChild(category);

          marker.bindPopup(popup);
          marker.addTo(layer);

          if (isFire) fireCount++;
          else hospitalCount++;
        });

        info.textContent =
          "OpenStreetMap facilities loaded: " +
          fireCount + " fire stations and " +
          hospitalCount + " hospitals.";

      } catch (error) {
        info.textContent =
          "Facility data could not be loaded: " +
          error.message;
        console.error(error);
      }
    }

    loadFacilities();

  </script>

</body>
</html>
